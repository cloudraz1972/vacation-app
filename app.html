<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8FAFC;--surface:#fff;--border:#E2E8F0;--text:#1E293B;--text2:#64748B;
  --blue:#3B82F6;--yellow:#FCD34D;--green:#10B981;--red:#EF4444;
  --nav:200px;--r:10px;--sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 12px rgba(0,0,0,.12);
}
html,body{direction:rtl;background:var(--bg);color:var(--text);font:14px/1.5 'Segoe UI',system-ui,sans-serif;height:100%}
#root{display:flex;min-height:100vh}
/* Nav */
.nav{width:var(--nav);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:fixed;right:0;top:0;bottom:0;z-index:100;box-shadow:-2px 0 8px rgba(0,0,0,.04);transition:transform .25s ease}
.nav.collapsed{transform:translateX(100%)}
.nav-brand{display:flex;align-items:center;gap:8px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-brand-icon{font-size:22px}.nav-brand-text{font-weight:700;font-size:15px}
.nav-links{list-style:none;display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--text2);font-size:14px;cursor:pointer;transition:.15s}
.nav-link:hover{background:var(--bg);color:var(--text)}
.nav-link.active{background:#EFF6FF;color:var(--blue);font-weight:600}
.nav-toggle{position:fixed;top:12px;right:12px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:var(--sh)}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}
.nav-overlay.show{display:block}
/* Main */
.main{flex:1;margin-right:var(--nav);padding:28px 32px;min-height:100vh;overflow-y:auto;transition:margin .25s ease}
.main.nav-collapsed{margin-right:0}
/* Mobile */
@media(max-width:640px){
  :root{--nav:80vw}
  .nav{transform:translateX(100%)}
  .nav.open{transform:translateX(0)}
  .main{margin-right:0;padding:16px}
  .nav-toggle{top:10px;right:10px}
  .page-header{flex-direction:column;align-items:flex-start}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row{flex-direction:column}
  .modal{width:95vw!important;max-width:95vw!important;padding:20px!important}
}
.page{max-width:1200px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563EB}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#CBD5E1}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:#FEE2E2;color:var(--red)}.btn-danger:hover{background:#FECACA}
.btn-icon{background:none;padding:4px 8px;border-radius:6px;font-size:16px;color:var(--text2)}.btn-icon:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 6px;font-size:11px;border-radius:4px}
/* Input */
.input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);width:100%;direction:rtl;transition:.15s}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.input-sm{padding:5px 8px;font-size:12px;border-radius:6px;width:auto}
/* Legend */
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
/* Year nav */
.year-nav{display:flex;align-items:center;gap:12px}
.year-nav .btn-icon{font-size:22px;padding:4px 10px;color:var(--blue)}
/* Selection hint */
.sel-hint{background:#EFF6FF;border:1px dashed var(--blue);color:var(--blue);padding:8px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
.day-popup{position:fixed;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shm);z-index:500;min-width:220px;max-width:300px;padding:12px;direction:rtl}
.day-popup-title{font-weight:700;font-size:13px;color:var(--text2);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.day-popup-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px}
.day-popup-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-popup-name{flex:1;font-size:13px;font-weight:500}
.day-popup-actions{display:flex;gap:4px;flex-shrink:0}
.day-popup-add{width:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);text-align:center;color:var(--blue);font-size:13px;cursor:pointer;font-weight:500}
.day-popup-add:hover{text-decoration:underline}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cal-zoom-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-zoom-bar input[type=range]{flex:1;max-width:140px;accent-color:var(--blue)}
.month{background:#1E293B;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.month-title{text-align:center;font-weight:800;font-size:14px;margin-bottom:8px;color:#F1F5F9;letter-spacing:.5px;padding:6px 0;background:#0F172A;border-radius:6px;font-family:'Nunito',sans-serif}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow{text-align:center;font-size:10px;color:#94A3B8;padding:2px 0;font-weight:700}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:4px;cursor:pointer;user-select:none;transition:.1s;font-weight:500;position:relative;color:#CBD5E1}
.day:hover{opacity:.8;outline:2px solid var(--blue);outline-offset:-1px}
.day.today{font-weight:900;box-shadow:inset 0 0 0 2px #FCD34D;color:#FCD34D}
.day.health-day{box-shadow:inset 0 0 0 2px #fff}
.day.in-sel{background:rgba(59,130,246,.15)!important}
.day.sel-start{background:var(--blue)!important;color:#fff!important}
.day.colored{color:#fff}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;padding:28px;width:440px;max-width:90vw;box-shadow:var(--shm);max-height:90vh;overflow-y:auto}
.modal h2{font-size:20px;font-weight:700;margin-bottom:6px}
.modal-dates{font-size:13px;color:var(--text2);margin-bottom:20px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-btns{display:flex;gap:8px;flex-wrap:wrap}
.type-btn{padding:7px 14px;border-radius:20px;border:2px solid var(--tc,#ccc);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text2);transition:.15s}
.type-btn.active,.type-btn:hover{background:var(--tc);color:#fff;border-color:var(--tc)}
.modal-actions{display:flex;gap:10px;margin-top:24px}
/* Vacations */
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.ftab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-family:inherit;color:var(--text2);transition:.15s}
.ftab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.ftab:hover:not(.active){border-color:var(--blue);color:var(--blue)}
.vac-list{display:flex;flex-direction:column;gap:12px}
.vac-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:12px}
.vac-tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}
.vac-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.vac-tab:hover:not(.active){color:var(--text)}
.traveler-list{display:flex;flex-direction:column;gap:14px}
.traveler-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
/* Daily Planner */
.dp-selector-row{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.dp-select{flex:1;min-width:180px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--surface);font-family:inherit;cursor:pointer}
.dp-year-tabs{display:flex;gap:4px;flex-wrap:wrap}
.dp-year-tab{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:none;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s}
.dp-year-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.dp-days-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px;scrollbar-width:thin}
.dp-day-dot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.dp-day-bubble{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;transition:.15s;font-weight:700}
.dp-day-num{font-size:14px;line-height:1}
.dp-day-date{font-size:9px;line-height:1;opacity:.85;margin-top:1px}
.dp-day-label{font-size:10px;color:var(--text2)}
.dp-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px 24px}
.dp-card-title{font-size:18px;font-weight:700;margin-bottom:4px}
.dp-card-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
/* Timeline */
.dp-timeline{position:relative;padding-right:20px}
.dp-timeline::before{content:'';position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--border);border-radius:1px}
.dp-tl-row{display:flex;align-items:flex-start;gap:12px;padding:8px 0;position:relative}
.dp-tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;outline:2px solid currentColor;flex-shrink:0;margin-top:2px;position:relative;right:-27px;background:currentColor}
.dp-tl-time{font-size:12px;font-weight:700;color:var(--blue);min-width:44px;padding-top:1px}
.dp-tl-icon{font-size:17px;flex-shrink:0}
.dp-tl-text{flex:1;font-size:14px;line-height:1.4}
.dp-tl-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:.15s}
.dp-tl-row:hover .dp-tl-actions{opacity:1}
.dp-activity-row{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.dp-add-row{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.dp-empty{color:var(--text2);font-size:14px;text-align:center;padding:32px 0}
.dp-view-toggle{display:flex;gap:6px;margin-bottom:16px}
.dp-view-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:none;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s}
.dp-view-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.gcal{direction:rtl;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--border)}
.gcal-header{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--border);background:var(--bg)}
.gcal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--text2);padding:8px 2px}
.gcal-week{display:grid;grid-template-columns:repeat(7,1fr);position:relative;border-bottom:1px solid var(--border)}
.gcal-week:last-child{border-bottom:none}
.gcal-cell{border-left:1px solid var(--border);position:relative;box-sizing:border-box;transition:background .1s;aspect-ratio:1}
.gcal-cell:last-child{border-left:none}
.gcal-cell-top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;height:28px;box-sizing:border-box}
.gcal-day-num{font-size:13px;font-weight:400;color:var(--text)}
.gcal-day-num.active{font-weight:700}
.gcal-act-badge{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}
.gcal-span-bar{position:absolute;display:flex;align-items:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;white-space:nowrap;box-sizing:border-box;z-index:2;transition:filter .1s}
.gcal-span-bar:hover{filter:brightness(1.15)}
.gcal-bar-del{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;font-size:11px;padding:0 4px;flex-shrink:0}
.gcal-drag-hint{font-size:11px;color:var(--text2);padding:6px 12px;border-top:1px solid var(--border)}
.gcal-form{padding:12px;background:var(--bg);border-top:2px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.span-color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:.1s}
.span-color-swatch.active{border-color:var(--text);transform:scale(1.2)}
.tcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);border-top:3px solid #8B5CF6;overflow:hidden}
.tcard-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px}
.tcard-info{}
.tcard-name-he{font-size:15px;font-weight:700;line-height:1.2}
.tcard-name-en{font-size:12px;color:var(--text2)}
.tcard-birth{font-size:11px;color:var(--text2);margin-top:2px}
.tcard-actions{display:flex;gap:4px;flex-shrink:0}
.tcard-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.tsec{border-top:1px solid var(--border);padding-top:8px}
.tsec-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.titem{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;color:var(--text)}
.titem-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem-add{font-size:11px;color:var(--blue);cursor:pointer;margin-top:2px;display:inline-block}
.titem-add:hover{text-decoration:underline}
.passport-photo{color:#3B82F6;font-size:12px;text-decoration:none}
.passport-photo:hover{text-decoration:underline}
.wcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:2px solid var(--border);border-right:5px solid transparent;overflow:hidden;display:flex;flex-direction:column}
.wcard-hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 10px;gap:10px}
.wcard-title{font-weight:700;font-size:15px;line-height:1.3}
.wcard-country{font-size:12px;color:var(--text2);margin-top:2px}
.wcard-priority{font-size:20px;flex-shrink:0}
.wcard-meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px;font-size:12px;color:var(--text2)}
.wcard-notes{padding:0 16px 12px;font-size:13px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.wcard-actions{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--border);margin-top:auto;flex-wrap:wrap}
.wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.wishlist-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.vcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:2px solid var(--border);border-right:5px solid transparent;overflow:hidden}
.day-flag{position:absolute;bottom:1px;right:2px;font-size:9px;line-height:1;pointer-events:none}
.day{position:relative}
.vcard-hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 20px;cursor:pointer;gap:12px}
.vcard-hdr:hover{background:#FAFAFA}
.vinfo{flex:1;min-width:0}
.vtop{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.vname{font-weight:700;font-size:16px}
.vcountry{font-size:13px;color:var(--text2)}
.vdates{font-size:12px;color:var(--text2)}
.type-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff}
.vactions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.total-badge{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.expiry-banner{background:#FEF3C7;border-bottom:2px solid #F59E0B;padding:10px 20px;direction:rtl;font-size:13px;display:flex;flex-direction:column;gap:6px}
.expiry-banner-title{font-weight:700;color:#92400E;display:flex;align-items:center;gap:6px}
.expiry-banner-item{display:flex;align-items:center;gap:8px;color:#78350F;padding:2px 0}
.expiry-banner-item.urgent{color:#DC2626;font-weight:600}
.expiry-banner-dismiss{align-self:flex-end;font-size:12px;color:#92400E;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0}
.exp-wrap{padding:0 20px 16px;border-top:1px solid var(--border);padding-top:16px}
.exp-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)}
.exp-total{text-align:left;margin-top:10px;font-size:14px;color:var(--text2)}
.tbl-wrap{overflow-x:auto}
.exp-mob-btn{display:none}
@media(max-width:700px){.exp-mob-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}}
.exp-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:flex-end;justify-content:center}
.exp-modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:24px 20px 32px;direction:rtl;max-height:90vh;overflow-y:auto}
.exp-modal-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.exp-modal-field{margin-bottom:14px}
.exp-modal-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600}
.exp-modal-field .input{width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-size:13px;direction:rtl}
th{text-align:right;padding:8px 10px;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}

function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

// ── שערי חליפין ────────────────────────────────────────────────────────────
let _ratesCache = null;
async function fetchExchangeRates() {
  if (_ratesCache) return _ratesCache;
  const r = await fetch('https://open.er-api.com/v6/latest/ILS');
  const d = await r.json();
  // d.rates[code] = כמה יחידות של המטבע = 1 שקל
  // אנחנו רוצים כמה שקלים = 1 יחידת מטבע → 1/rate
  _ratesCache = d.rates;
  return _ratesCache;
}
async function getILSRate(currencyCode) {
  if (currencyCode === 'ILS') return 1;
  try {
    const rates = await fetchExchangeRates();
    const rate = rates[currencyCode];
    if (!rate) return null;
    return Math.round((1 / rate) * 100) / 100;
  } catch(e) { return null; }
}
function countryFlag(code) { if(!code||code.length!==2)return ''; return String.fromCodePoint(...[...code.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)); }
function fmtDate(d) { if (!d) return ''; const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }
function numFmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function getDayStyle(types) {
  const PRIORITY = ['health','paid','planned','work','note','closed','school'];
  const present = PRIORITY.filter(t => types.has(t));
  if (present.length === 0) return {};
  if (present.length === 1) return { backgroundColor: COLORS[present[0]] };
  // שני סוגים שונים — גרדיאנט אלכסוני: הראשון בעדיפות בפינה ימין-למעלה
  return { background: `linear-gradient(135deg,${COLORS[present[0]]} 50%,${COLORS[present[1]]} 50%)` };
}

function dateRange(a, b) {
  const dates = [], cur = new Date(a), end = new Date(b);
  while (cur <= end) { dates.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  return dates;
}

const Ctx = createContext(null);
const SKEY = 'vacation-app-v2';
const initState = { year: new Date().getFullYear(), vacations: [], cats: [...DEFAULT_CATS], docTypes: [...DEFAULT_DOC_TYPES], travelers: [], anthropicKey: '', wishlist: [] };

function reducer(s, a) {
  switch(a.t) {
    case 'SET_YEAR': return {...s, year: a.year};
    case 'ADD_VAC': return {...s, vacations: [...s.vacations, {...a.v, id:genId(), expenses:[], travelers:[]}]};
    case 'UPD_VAC': return {...s, vacations: s.vacations.map(v => v.id===a.id ? {...v,...a.u} : v)};
    case 'DEL_VAC': return {...s, vacations: s.vacations.filter(v => v.id!==a.id)};
    case 'ADD_EXP': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, expenses:[...v.expenses,{...a.e,id:genId()}]} : v)};
    case 'UPD_EXP': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, expenses:v.expenses.map(e => e.id===a.eid?{...e,...a.u}:e)} : v)};
    case 'DEL_EXP': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, expenses:v.expenses.filter(e=>e.id!==a.eid)} : v)};
    case 'ADD_VAC_DOC': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, vacDocs:[...(v.vacDocs||[]),{...a.d,id:genId()}]} : v)};
    case 'UPD_VAC_DOC': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, vacDocs:(v.vacDocs||[]).map(d=>d.id===a.did?{...d,...a.u}:d)} : v)};
    case 'DEL_VAC_DOC': return {...s, vacations: s.vacations.map(v => v.id===a.vid ? {...v, vacDocs:(v.vacDocs||[]).filter(d=>d.id!==a.did)} : v)};
    case 'ADD_CAT': return s.cats.includes(a.n) ? s : {...s, cats:[...s.cats,a.n]};
    case 'REN_CAT': return {...s, cats:s.cats.map(c=>c===a.o?a.n:c)};
    case 'DEL_CAT': return {...s, cats:s.cats.filter(c=>c!==a.n)};
    case 'ADD_DOC_TYPE': return (s.docTypes||[]).includes(a.n) ? s : {...s, docTypes:[...(s.docTypes||[]),a.n]};
    case 'REN_DOC_TYPE': return {...s, docTypes:(s.docTypes||[]).map(c=>c===a.o?a.n:c)};
    case 'DEL_DOC_TYPE': return {...s, docTypes:(s.docTypes||[]).filter(c=>c!==a.n)};
    case 'LOAD': return {...initState,...a.s,travelers:s.travelers};
    case 'SET_ANTHROPIC_KEY': return {...s, anthropicKey:a.key};
    case 'ADD_WISH': return {...s, wishlist:[...(s.wishlist||[]),{...a.w,id:genId(),addedDate:new Date().toISOString().slice(0,10)}]};
    case 'UPD_WISH': return {...s, wishlist:(s.wishlist||[]).map(w=>w.id===a.id?{...w,...a.u}:w)};
    case 'DEL_WISH': return {...s, wishlist:(s.wishlist||[]).filter(w=>w.id!==a.id)};
    case 'LOAD_TRAVELERS': return {...s, travelers:a.travelers||[]};
    case 'ADD_TRAVELER': return {...s, travelers:[...s.travelers,{passports:[],frequentFlyer:[],...a.tv,id:genId()}]};
    case 'UPD_TRAVELER': return {...s, travelers:s.travelers.map(t=>t.id===a.id?{...t,...a.u}:t)};
    case 'DEL_TRAVELER': return {...s, travelers:s.travelers.filter(t=>t.id!==a.id)};
    default: return s;
  }
}

function StoreProvider({children}) {
  const [state, dispatch] = useReducer(reducer, initState);
  const [loaded, setLoaded] = useState(false);
  const [travelersLoaded, setTravelersLoaded] = useState(false);
  const saveTimer = useRef(null);
  const travSaveTimer = useRef(null);
  const travelersRef = useRef([]);

  useEffect(()=>{
    STATE_DOC.get().then(doc=>{
      if(doc.exists) dispatch({t:'LOAD', s:doc.data()});
      setLoaded(true);
    }).catch(()=>setLoaded(true));
  },[]);

  useEffect(()=>{
    TRAVELERS_DOC.get().then(doc=>{
      const list = doc.exists ? (doc.data().travelers||[]) : [];
      travelersRef.current = list;
      dispatch({t:'LOAD_TRAVELERS', travelers:list});
      setTravelersLoaded(true);
    }).catch(()=>setTravelersLoaded(true));
  },[]);

  const stateRef = useRef(state);
  useEffect(()=>{ stateRef.current = state; },[state]);

  useEffect(()=>{
    if(!loaded) return;
    async function save(){
      try {
        const {travelers, ...mainState} = stateRef.current;
        await STATE_DOC.set(mainState);
      } catch(e){ console.error('שגיאת שמירה:', e); alert('שגיאה בשמירה: '+e.message); }
    }
    function beforeUnload(){ save(); }
    window.addEventListener('beforeunload', beforeUnload);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(save, 300);
    return ()=>window.removeEventListener('beforeunload', beforeUnload);
  },[state, loaded]);

  // שמור travelers כשמשתנים
  useEffect(()=>{
    if(!travelersLoaded) return;
    if(JSON.stringify(state.travelers)===JSON.stringify(travelersRef.current)) return;
    travelersRef.current = state.travelers;
    clearTimeout(travSaveTimer.current);
    travSaveTimer.current = setTimeout(async ()=>{
      try { await TRAVELERS_DOC.set({travelers: state.travelers}); }
      catch(e){ console.error('שגיאת שמירת נוסעים:', e); alert('שגיאה בשמירת נוסעים: '+e.message); }
    }, 600);
  },[state.travelers, travelersLoaded]);

  if(!loaded||!travelersLoaded) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,color:'#64748B'}}>
      <div style={{fontSize:32}}>🌴</div>
      <div>טוען נתונים...</div>
    </div>
  );
  return <Ctx.Provider value={{state,dispatch}}>{children}</Ctx.Provider>;
}
function useStore() { return useContext(Ctx); }

const PIE_COLS = ['#3B82F6','#10B981','#FCD34D','#EF4444','#8B5CF6','#06B6D4','#F97316','#EC4899','#14B8A6','#84CC16'];

function BarChart({data, colorFn}) {
  if (!data.length) return null;
  const W=500, H=220, PAD={t:10,r:10,b:60,l:60};
  const maxV = Math.max(...data.map(d=>d.v), 1);
  const cW = (W-PAD.l-PAD.r)/data.length;
  const barW = Math.min(cW*0.6, 50);
  return (
    <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`}>
      {[0,.25,.5,.75,1].map(p=>{
        const y=PAD.t+(H-PAD.t-PAD.b)*(1-p);
        return <g key={p}>
          <line x1={PAD.l} x2={W-PAD.r} y1={y} y2={y} stroke="#F3F4F6" strokeWidth="1"/>
          <text x={PAD.l-6} y={y+4} textAnchor="end" fontSize="10" fill="#94A3B8">{numFmt(maxV*p)}</text>
        </g>;
      })}
      {data.map((d,i)=>{
        const x=PAD.l+cW*i+cW/2;
        const bH=(d.v/maxV)*(H-PAD.t-PAD.b);
        const y=PAD.t+(H-PAD.t-PAD.b)-bH;
        const lbl=d.name.length>10?d.name.slice(0,10)+'…':d.name;
        return <g key={i}>
          <rect x={x-barW/2} y={y} width={barW} height={bH} fill={colorFn?colorFn(d):PIE_COLS[i%PIE_COLS.length]} rx="3"/>
          <text x={x} y={H-PAD.b+14} textAnchor="middle" fontSize="10" fill="#64748B">{lbl}</text>
          {bH>16&&<text x={x} y={y+12} textAnchor="middle" fontSize="10" fill="#fff" fontWeight="600">{numFmt(d.v)}</text>}
        </g>;
      })}
    </svg>
  );
}

function PieChart({data}) {
  if (!data.length) return null;
  const total = data.reduce((s,d)=>s+d.v,0);
  let angle = -Math.PI/2;
  const cx=150,cy=110,r=90;
  const slices = data.map((d,i)=>{
    const sweep=(d.v/total)*Math.PI*2;
    const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
    angle+=sweep;
    const x2=cx+r*Math.cos(angle), y2=cy+r*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    return {d:`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`, c:PIE_COLS[i%PIE_COLS.length], name:d.name, v:d.v, pct:((d.v/total)*100).toFixed(0)};
  });
  return (
    <svg className="chart-svg" viewBox="0 0 500 220">
      {slices.map((s,i)=><path key={i} d={s.d} fill={s.c} stroke="#fff" strokeWidth="2"/>)}
      <div/>
    </svg>
  );
}

function buildDayMap(vacations) {
  const m = {};
  for (const v of vacations) {
    for (const d of dateRange(v.startDate, v.endDate)) {
      if (!m[d]) m[d] = {types:new Set(), vacs:[]};
      m[d].types.add(v.type);
      m[d].vacs.push(v);
    }
  }
  return m;
}

function isInRange(d, a, b) {
  if (!a || !b) return false;
  const lo=a<b?a:b, hi=a<b?b:a;
  return d>=lo && d<=hi;
}

function MonthGrid({year,month,dayMap,selStart,hoverDate,onDayClick,onDayHover,dragState,dropDate,onDragStartVac,onDragOverDay,onDropDay,onDragEnd,onTouchStartVac}) {
  const first = new Date(year,month,1);
  const days = new Date(year,month+1,0).getDate();
  const startDow = first.getDay();
  const today = new Date().toISOString().slice(0,10);
  const cells = [...Array(startDow).fill(null), ...Array.from({length:days},(_,i)=>i+1)];
  return (
    <div className="month">
      <div className="month-title">{HEB_MONTHS[month]}</div>
      <div className="dow-row">{HEB_DAYS.map(d=><span key={d} className="dow">{d}</span>)}</div>
      <div className="days-grid">
        {cells.map((day,i)=>{
          if(!day) return <span key={`_${i}`}/>;
          const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const info=dayMap[ds];
          // vacation that starts on this exact day (draggable handle)
          const dragVac=info?.vacs.find(v=>v.startDate===ds&&v.type!=='school');
          // drop zone feedback
          let dropStyle={};
          if(dragState&&ds===dropDate){
            const occupied=info?.vacs.some(v=>v.id!==dragState.vacId);
            dropStyle={background:occupied?'#FEF3C7':'#D1FAE5',outline:'2px solid '+(occupied?'#F59E0B':'#10B981'),outlineOffset:'-2px'};
          }
          const baseStyle=dragState?{}:(info?getDayStyle(info.types):{});
          const style={...baseStyle,...dropStyle};
          const hasColor=!dragState&&Object.keys(baseStyle).length>0;
          const inSel=isInRange(ds,selStart,hoverDate);
          const isStart=ds===selStart;
          const isToday=ds===today;
          const paidVac=info&&info.vacs.find(v=>(v.type==='paid'||v.type==='planned')&&v.countryCode);
          const flag=paidVac?countryFlag(paidVac.countryCode):'';
          return (
            <span key={day}
              data-day={ds}
              className={`day${hasColor?' colored':''}${inSel&&!isStart?' in-sel':''}${isStart?' sel-start':''}${isToday?' today':''}${info&&info.types.has('health')?' health-day':''}`}
              style={{...style,cursor:dragVac&&!dragState?'grab':undefined}}
              draggable={!!dragVac&&!selStart}
              onDragStart={dragVac&&!selStart?e=>onDragStartVac(dragVac,e):undefined}
              onDragOver={dragState?e=>onDragOverDay(ds,e):undefined}
              onDrop={dragState?()=>onDropDay(ds):undefined}
              onDragEnd={onDragEnd}
              onTouchStart={dragVac&&!selStart?e=>onTouchStartVac(dragVac,e):undefined}
              onClick={e=>!dragState&&onDayClick(ds,e)}
              onMouseEnter={()=>onDayHover(ds)}
              title={info?info.vacs.map(v=>v.name).join(', '):''}
            >{day}{flag&&<span className="day-flag">{flag}</span>}</span>
          );
        })}
      </div>
    </div>
  );
}

function CalendarPage({onGoToVac, onGoToPlanner}) {
  const {state,dispatch}=useStore();
  const {year,vacations}=state;
  const [selStart,setSelStart]=useState(null);
  const [hoverDate,setHoverDate]=useState(null);
  const [pendingEnd,setPendingEnd]=useState(null);
  const [popup,setPopup]=useState(null); // {ds, vacs, pos}
  const [editVac,setEditVac]=useState(null);
  const dayMap=useMemo(()=>buildDayMap(vacations),[vacations]);

  function handleDayClick(ds, e) {
    if(selStart&&!pendingEnd){setPendingEnd(ds);return;}
    const info=dayMap[ds];
    const nonSchoolVacs=info?info.vacs.filter(v=>v.type!=='school'):[];
    if(nonSchoolVacs.length>0&&!selStart){
      const rect=e.target.getBoundingClientRect();
      setPopup({ds,vacs:nonSchoolVacs,pos:{x:rect.left,y:rect.bottom+4}});
    } else {
      setPopup(null);
      if(!selStart){setSelStart(ds);setHoverDate(ds);}
    }
  }
  function handleSave(vac){
    dispatch({t:'ADD_VAC',v:vac});
    setSelStart(null);setPendingEnd(null);setHoverDate(null);
  }
  function handleClose(){setSelStart(null);setPendingEnd(null);setHoverDate(null);}
  function handleDelete(v){
    if(confirm(`למחוק את "${v.name}"?`)){dispatch({t:'DEL_VAC',id:v.id});}
    setPopup(null);
  }
  function handleEdit(v){setEditVac(v);setPopup(null);}
  function handleAddOnDay(ds){
    setPopup(null);
    setSelStart(ds);setHoverDate(ds);setPendingEnd(ds);
  }
  const lo=selStart&&hoverDate?(selStart<hoverDate?selStart:hoverDate):null;
  const hi=selStart&&hoverDate?(selStart<hoverDate?hoverDate:selStart):null;

  const [zoom, setZoom] = useState(100);
  const MONTH_ORDER = [0,3,6,9, 1,4,7,10, 2,5,8,11];

  const [dragState, setDragState] = useState(null); // {vacId, durationDays}
  const [dropDate, setDropDate] = useState(null);
  const touchDragRef = useRef(null);
  const dragStateRef = useRef(null);
  useEffect(()=>{ dragStateRef.current = dragState; },[dragState]);

  function handleDragStartVac(vac, e) {
    const dur = Math.round((new Date(vac.endDate)-new Date(vac.startDate))/(1000*60*60*24));
    setDragState({vacId:vac.id, durationDays:dur});
    e.dataTransfer.effectAllowed='move';
  }
  function handleDragOverDay(ds, e) {
    e.preventDefault();
    setDropDate(ds);
  }
  function handleDropDay(ds) {
    const ds2 = dragStateRef.current;
    if(!ds2) return;
    const newEnd=new Date(new Date(ds).getTime()+ds2.durationDays*86400000).toISOString().slice(0,10);
    dispatch({t:'UPD_VAC',id:ds2.vacId,u:{startDate:ds,endDate:newEnd}});
    setDragState(null); setDropDate(null);
  }
  function handleDragEnd() { setDragState(null); setDropDate(null); }

  // Touch drag — לאנדרואיד
  function handleTouchStartVac(vac, e) {
    e.preventDefault();
    const dur = Math.round((new Date(vac.endDate)-new Date(vac.startDate))/(1000*60*60*24));
    const ds = {vacId:vac.id, durationDays:dur};
    touchDragRef.current = ds;
    setDragState(ds);
  }

  useEffect(()=>{
    function getDayAt(x,y){
      const el = document.elementFromPoint(x,y);
      return el?.closest('[data-day]')?.getAttribute('data-day') || null;
    }
    function onTouchMove(e){
      if(!touchDragRef.current) return;
      if(e.cancelable) e.preventDefault();
      const t=e.touches[0];
      const ds=getDayAt(t.clientX,t.clientY);
      if(ds) setDropDate(ds);
    }
    function onTouchEnd(e){
      if(!touchDragRef.current) return;
      const t=e.changedTouches[0];
      const ds=getDayAt(t.clientX,t.clientY);
      if(ds) handleDropDay(ds); else handleDragEnd();
      touchDragRef.current=null;
    }
    window.addEventListener('touchmove',onTouchMove,{passive:false});
    window.addEventListener('touchend',onTouchEnd);
    return ()=>{
      window.removeEventListener('touchmove',onTouchMove);
      window.removeEventListener('touchend',onTouchEnd);
    };
  },[]);

  return (
    <div className="page">
      <div className="page-header">
        <div className="year-nav">
          <button className="btn btn-icon" onClick={()=>dispatch({t:'SET_YEAR',year:year-1})}>‹</button>
          <h1 className="page-title">{year}</h1>
          <button className="btn btn-icon" onClick={()=>dispatch({t:'SET_YEAR',year:year+1})}>›</button>
        </div>
        <div className="legend">
          {Object.entries(COLORS).map(([k,c])=>(
            <span key={k} className="legend-item">
              <span className="legend-dot" style={{background:c}}/>
              {TYPE_LABELS[k]}
            </span>
          ))}
        </div>
      </div>
      <div className="cal-zoom-bar">
        <span style={{fontSize:13,color:'#64748B',whiteSpace:'nowrap'}}>גודל תצוגה</span>
        <button className="btn btn-icon btn-sm" onClick={()=>setZoom(z=>Math.max(50,z-10))}>−</button>
        <input type="range" min="50" max="150" value={zoom} onChange={e=>setZoom(Number(e.target.value))}/>
        <button className="btn btn-icon btn-sm" onClick={()=>setZoom(z=>Math.min(150,z+10))}>+</button>
        <span style={{fontSize:12,color:'#94A3B8',width:36}}>{zoom}%</span>
        <button className="btn btn-secondary btn-sm" onClick={()=>setZoom(100)}>איפוס</button>
      </div>
      {selStart&&!pendingEnd&&(
        <div className="sel-hint">
          לחץ על תאריך סיום
          {lo&&hi&&lo!==hi&&` (${fmtDate(lo)} — ${fmtDate(hi)})`}
        </div>
      )}
      <div style={{transformOrigin:'top right',transform:`scale(${zoom/100})`,transition:'transform .2s',marginBottom:`calc((${zoom} - 100) * 3px)`}}>
      <div className="cal-grid">
        {MONTH_ORDER.map(m=>(
          <MonthGrid key={m} year={year} month={m} dayMap={dayMap}
            selStart={selStart} hoverDate={hoverDate}
            onDayClick={handleDayClick} onDayHover={ds=>selStart&&!pendingEnd&&setHoverDate(ds)}
            dragState={dragState} dropDate={dropDate}
            onDragStartVac={handleDragStartVac} onDragOverDay={handleDragOverDay}
            onDropDay={handleDropDay} onDragEnd={handleDragEnd}
            onTouchStartVac={handleTouchStartVac}/>
        ))}
      </div>
      </div>
      {popup&&<DayEventsPopup ds={popup.ds} vacs={popup.vacs} pos={popup.pos}
        onClose={()=>setPopup(null)} onEdit={handleEdit} onDelete={handleDelete}
        onAdd={()=>handleAddOnDay(popup.ds)} onGoToVac={onGoToVac?id=>{setPopup(null);onGoToVac(id);}:undefined}
        onGoToPlanner={onGoToPlanner?id=>{setPopup(null);onGoToPlanner(id);}:undefined}/>}
      {pendingEnd&&selStart&&(
        <AddVacModal start={selStart} end={pendingEnd} cats={state.cats} onClose={handleClose} onSave={handleSave}/>
      )}
      {editVac&&(
        <EditVacFromCalModal v={editVac} onClose={()=>setEditVac(null)}
          onSave={u=>{const cn=COUNTRIES.find(c=>c.code===u.countryCode);dispatch({t:'UPD_VAC',id:editVac.id,u:{...u,countryName:cn?.name||''}});setEditVac(null);}}/>
      )}
    </div>
  );
}

// ── World Map ──────────────────────────────────────────────────────────────
function WorldMapPage() {
  const {state}=useStore();
  const svgRef=useRef(null);
  const gRef=useRef(null);
  const zoomRef=useRef(null);
  const [tooltip,setTooltip]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [zoomLevel,setZoomLevel]=useState(1);

  const visitedNums=useMemo(()=>{
    const paid=new Set(), work=new Set();
    for(const v of state.vacations){
      if(!v.countryCode) continue;
      const c=COUNTRIES.find(x=>x.code===v.countryCode);
      if(!c) continue;
      if(v.type==='paid') paid.add(c.num);
      else if(v.type==='work') work.add(c.num);
    }
    return {paid, work};
  },[state.vacations]);

  useEffect(()=>{
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r=>r.json())
      .then(world=>{
        const countries=topojson.feature(world,world.objects.countries);
        const proj=d3.geoNaturalEarth1().fitSize([860,480],countries);
        const pathGen=d3.geoPath(proj);
        const svg=d3.select(svgRef.current);
        svg.selectAll('*').remove();

        // group for zoom/pan
        const g=svg.append('g');
        gRef.current=g;

        g.selectAll('path')
          .data(countries.features)
          .join('path')
          .attr('d',pathGen)
          .attr('fill',d=>{const id=String(d.id);return visitedNums.paid.has(id)?'#10B981':visitedNums.work.has(id)?'#3B82F6':'#D1D5DB';})
          .attr('stroke','#fff')
          .attr('stroke-width',0.3)
          .style('cursor','pointer')
          .on('mouseover',function(event,d){
            const id=String(d.id);const c=numToCountry[id];
            if(c){
              const type=visitedNums.paid.has(id)?'paid':visitedNums.work.has(id)?'work':null;
              setTooltip({name:c.name,type,x:event.clientX,y:event.clientY});
              d3.select(this).attr('fill',visitedNums.paid.has(id)?'#059669':visitedNums.work.has(id)?'#2563EB':'#9CA3AF');
            }
          })
          .on('mousemove',function(event){
            setTooltip(t=>t?{...t,x:event.clientX,y:event.clientY}:null);
          })
          .on('mouseleave',function(event,d){
            setTooltip(null);
            const id=String(d.id);
            d3.select(this).attr('fill',visitedNums.paid.has(id)?'#10B981':visitedNums.work.has(id)?'#3B82F6':'#D1D5DB');
          });

        // zoom behavior
        const zoom=d3.zoom()
          .scaleExtent([1,12])
          .on('zoom',(event)=>{
            g.attr('transform',event.transform);
            // thinner strokes when zoomed in
            g.selectAll('path').attr('stroke-width',0.3/event.transform.k);
            setZoomLevel(Math.round(event.transform.k*10)/10);
          });
        zoomRef.current=zoom;
        svg.call(zoom);
        svg.on('dblclick.zoom',null); // disable double-click zoom (we handle it)

        setLoading(false);
      })
      .catch(()=>{setError('לא ניתן לטעון את המפה. אנא ודא שיש חיבור לאינטרנט.');setLoading(false);});
  },[visitedNums]);

  function doZoom(factor){
    if(!svgRef.current||!zoomRef.current) return;
    d3.select(svgRef.current).transition().duration(300).call(zoomRef.current.scaleBy,factor);
  }
  function resetZoom(){
    if(!svgRef.current||!zoomRef.current) return;
    d3.select(svgRef.current).transition().duration(400).call(zoomRef.current.transform,d3.zoomIdentity);
  }

  const visitedList=useMemo(()=>
    [...visitedNums.paid,...visitedNums.work].map(n=>numToCountry[n]).filter(Boolean),
  [visitedNums]);

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">מפת העולם שלנו</h1>
        <div className="map-stats">
          <span className="map-badge">🟢 {visitedNums.paid.size} חופשות &nbsp;🔵 {visitedNums.work.size} עבודה</span>
        </div>
      </div>
      <div className="map-wrap" style={{position:'relative'}}>
        {loading&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#64748B'}}>⏳ טוען מפה...</div>}
        {error&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#EF4444'}}>{error}</div>}
        <svg ref={svgRef} viewBox="0 0 860 480" style={{width:'100%',height:'100%',display:loading||error?'none':'block',cursor:'grab'}}/>
        {/* Zoom controls */}
        {!loading&&!error&&(
          <div style={{position:'absolute',bottom:16,left:16,display:'flex',flexDirection:'column',gap:6,zIndex:10}}>
            <button className="btn btn-secondary" style={{width:36,height:36,padding:0,fontSize:20,fontWeight:700,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 6px rgba(0,0,0,.15)'}} onClick={()=>doZoom(1.6)} title="הגדל">+</button>
            <div style={{textAlign:'center',fontSize:11,color:'#64748B',fontWeight:600,background:'#fff',borderRadius:6,padding:'2px 0',boxShadow:'0 1px 3px rgba(0,0,0,.1)'}}>{zoomLevel}×</div>
            <button className="btn btn-secondary" style={{width:36,height:36,padding:0,fontSize:24,fontWeight:700,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 6px rgba(0,0,0,.15)'}} onClick={()=>doZoom(0.625)} title="הקטן">−</button>
            <button className="btn btn-secondary" style={{width:36,height:36,padding:0,fontSize:13,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 6px rgba(0,0,0,.15)'}} onClick={resetZoom} title="איפוס">⌂</button>
          </div>
        )}
        {tooltip&&(
          <div className="map-tooltip" style={{top:tooltip.y-10,left:tooltip.x+10}}>
            {tooltip.name}
            {tooltip.type==='paid'&&<span style={{color:'#34D399',fontWeight:700}}> ✓ חופשה</span>}
            {tooltip.type==='work'&&<span style={{color:'#93C5FD',fontWeight:700}}> ✓ עבודה</span>}
          </div>
        )}
      </div>
      <div style={{marginTop:8,fontSize:12,color:'#94A3B8',textAlign:'center'}}>גרור להזזה • גלגל העכבר / כפתורי + − להגדלה</div>
      {visitedList.length>0&&(
        <div style={{marginTop:16}}>
          <h3 style={{marginBottom:12,fontWeight:700,fontSize:16}}>מדינות שבוקרו</h3>
          <div className="map-visited">
            {visitedList.map(c=><span key={c.code} className="vtag">{c.name}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

function ExpRow({exp,cats,onUpdate,onDelete}) {
  const [ed,setEd]=useState(false);
  const [f,setF]=useState({...exp});
  const [rateLoading,setRateLoading]=useState(false);
  function save(){
    const r=f.currency==='ILS'?1:parseFloat(f.exchangeRate||1);
    onUpdate({...f,exchangeRate:r,amountILS:parseFloat(f.amount||0)*r});
    setEd(false);
  }
  async function handleCurrencyChange(code){
    setF(p=>({...p,currency:code,exchangeRate:''}));
    if(code==='ILS') return;
    setRateLoading(true);
    const rate=await getILSRate(code);
    setRateLoading(false);
    if(rate) setF(p=>({...p,currency:code,exchangeRate:String(rate)}));
  }
  useEffect(()=>{
    if(!ed||f.currency==='ILS'||f.exchangeRate) return;
    handleCurrencyChange(f.currency);
  },[ed]);
  const ils=ed?(f.currency==='ILS'?parseFloat(f.amount||0):parseFloat(f.amount||0)*parseFloat(f.exchangeRate||1)):exp.amountILS||0;
  if(ed) return (
    <tr>
      <td><select className="input input-sm" value={f.category} onChange={e=>setF({...f,category:e.target.value})}>{cats.map(c=><option key={c}>{c}</option>)}</select></td>
      <td><input className="input input-sm" type="number" value={f.amount} onChange={e=>setF({...f,amount:e.target.value})} style={{width:80}}/></td>
      <td><select className="input input-sm" value={f.currency} onChange={e=>handleCurrencyChange(e.target.value)}>{CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.code}</option>)}</select></td>
      <td>{f.currency!=='ILS'&&<input className="input input-sm" type="number" step="0.01" value={f.exchangeRate} onChange={e=>setF({...f,exchangeRate:e.target.value})} style={{width:70}} placeholder={rateLoading?'טוען…':'שער'}/>}</td>
      <td className="ils-cell">{ils.toFixed(2)} ₪</td>
      <td><input className="input input-sm" value={f.description} onChange={e=>setF({...f,description:e.target.value})} style={{width:120}}/></td>
      <td><input className="input input-sm" dir="ltr" value={f.url||''} onChange={e=>setF({...f,url:e.target.value})} style={{width:140}} placeholder="https://..."/></td>
      <td><button className="btn btn-primary btn-xs" onClick={save}>✓</button> <button className="btn btn-secondary btn-xs" onClick={()=>setEd(false)}>✕</button></td>
    </tr>
  );
  return (
    <tr>
      <td>{exp.category}</td>
      <td>{exp.amount} {exp.currency}</td>
      <td>{exp.currency==='ILS'?'—':`× ${exp.exchangeRate}`}</td>
      <td>{exp.currency}</td>
      <td className="ils-cell">{(exp.amountILS||0).toFixed(2)} ₪</td>
      <td>{exp.description}</td>
      <td>{exp.url&&<button className="btn btn-icon btn-xs" title={exp.url} onClick={()=>window.open(exp.url,'_blank')}>🔗</button>}</td>
      <td>
        <button className="btn btn-icon btn-xs" onClick={()=>setEd(true)}>✏️</button>
        <button className="btn btn-icon btn-xs" onClick={onDelete}>🗑️</button>
      </td>
    </tr>
  );
}

function AddExpModal({cats,onAdd,onClose}) {

    setF(p=>({...p,currency:code,exchangeRate:''}));

    setRateLoading(true);
    const rate=await getILSRate(code);
    setRateLoading(false);
    if(rate) setF(p=>({...p,currency:code,exchangeRate:String(rate)}));

    if(f.currency!=='ILS'&&!f.exchangeRate) handleCurrencyChange(f.currency);

            <input className="input" type="number" step="0.01" inputMode="decimal" value={f.exchangeRate} onChange={e=>setF({...f,exchangeRate:e.target.value})} placeholder={rateLoading?'טוען…':'שער'}/>

          <label>תיאור</label>
          <input className="input" value={f.description} onChange={e=>setF({...f,description:e.target.value})} placeholder="תיאור ההוצאה"/>
        </div>
        <div className="exp-modal-field">
          <label>קישור</label>
          <input className="input" dir="ltr" value={f.url} onChange={e=>setF({...f,url:e.target.value})} placeholder="https://..."/>
        </div>
        <button className="btn btn-primary" style={{width:'100%',padding:'12px'}} onClick={add}>+ הוסף הוצאה</button>
      </div>
    </div>
  );
}

    if(!f.amount) return;
    const r=f.currency==='ILS'?1:parseFloat(f.exchangeRate||1);
    onAdd({...f,exchangeRate:r,amountILS:parseFloat(f.amount)*r});
    setF({...f,amount:'',exchangeRate:'',description:''});
  }
  async function handleCurrencyChange(code){
    setF(p=>({...p,currency:code,exchangeRate:''}));
    if(code==='ILS') return;
    setRateLoading(true);
    const rate=await getILSRate(code);
    setRateLoading(false);
    if(rate) setF(p=>({...p,currency:code,exchangeRate:String(rate)}));
  }
  // טען שער ראשוני ל-USD בטעינה
  useEffect(()=>{
    if(f.currency!=='ILS'&&!f.exchangeRate) handleCurrencyChange(f.currency);
  },[]);
  return (
    <tr style={{background:'#F8FAFC'}}>
      <td><select className="input input-sm" value={f.category} onChange={e=>setF({...f,category:e.target.value})}>{cats.map(c=><option key={c}>{c}</option>)}</select></td>
      <td><input className="input input-sm" type="number" value={f.amount} onChange={e=>setF({...f,amount:e.target.value})} style={{width:80}} placeholder="סכום"/></td>
      <td><select className="input input-sm" value={f.currency} onChange={e=>handleCurrencyChange(e.target.value)}>{CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.code}</option>)}</select></td>
      <td>{f.currency!=='ILS'&&<input className="input input-sm" type="number" step="0.01" value={f.exchangeRate} onChange={e=>setF({...f,exchangeRate:e.target.value})} style={{width:70}} placeholder={rateLoading?'טוען…':'שער ל-₪'}/>}</td>
      <td className="ils-cell">{f.amount?(f.currency==='ILS'?parseFloat(f.amount).toFixed(2):(parseFloat(f.amount)*parseFloat(f.exchangeRate||1)).toFixed(2)):''}{f.amount?' ₪':''}</td>
      <td><input className="input input-sm" value={f.description} onChange={e=>setF({...f,description:e.target.value})} style={{width:120}} placeholder="תיאור"/></td>
      <td><input className="input input-sm" dir="ltr" value={f.url||''} onChange={e=>setF({...f,url:e.target.value})} style={{width:140}} placeholder="https://..."/></td>
      <td><button className="btn btn-primary btn-sm" onClick={add}>+ הוסף</button></td>
    </tr>
  );
}

function downloadICS(vac, method='PUBLISH') {
  const uid = vac.id + '@vacation-app';
  const now = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const start = vac.startDate.replace(/-/g,'');
  const endDate = new Date(vac.endDate);
  endDate.setDate(endDate.getDate()+1);
  const end = endDate.toISOString().slice(0,10).replace(/-/g,'');
  const status = method==='CANCEL'?'CANCELLED':'CONFIRMED';
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vacation App//HE',
    `METHOD:${method}`,
    'BEGIN:VEVENT',
    `UID:${uid}`,`DTSTAMP:${now}`,
    `DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,
    `SUMMARY:${vac.name}`,`STATUS:${status}`,
    vac.countryName?`LOCATION:${vac.countryName}`:'',
    vac.composition?`DESCRIPTION:הרכב: ${vac.composition}`:'',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([lines],{type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`${vac.name}.ics`; a.click();
  URL.revokeObjectURL(url);
}

function VacationsPage({focusVacId, onClearFocus, onGoToPlanner}) {
  const {state,dispatch}=useStore();
  const curYear=String(new Date().getFullYear());
  const [types,setTypes]=useState(new Set(['planned','paid']));
  const [yearFilter,setYearFilter]=useState(curYear);
  const [addModal,setAddModal]=useState(false);
  const focusRef=useRef(null);
  useEffect(()=>{
    if(!focusVacId) return;
    // Show all types and all years so the card is visible
    setTypes(new Set());
    setYearFilter('all');
  },[focusVacId]);
  useEffect(()=>{
    if(!focusVacId||!focusRef.current) return;
    const el=focusRef.current;
    setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});if(onClearFocus)onClearFocus();},400);
  },[focusVacId]);
  const years=useMemo(()=>[...new Set(state.vacations.map(v=>v.startDate.slice(0,4)))].sort((a,b)=>b-a),[state.vacations]);

  function toggleType(v) {
    setTypes(prev=>{
      const next=new Set(prev);
      if(next.has(v)) { next.delete(v); } else { next.add(v); }
      return next;
    });
  }
  function allTypes() { setTypes(new Set()); }

  const list=state.vacations
    .filter(v=>(types.size===0||types.has(v.type))&&(yearFilter==='all'||v.startDate.startsWith(yearFilter)))
    .sort((a,b)=>a.startDate.localeCompare(b.startDate));

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">חופשות</h1>

        <button className={`ftab${types.size===0?' active':''}`} onClick={allTypes}>הכל</button>
        {[['school','בית ספר'],['planned','מתוכננות'],['paid','משולמות'],['health','בריאות'],['closed','יומן סגור'],['work','נסיעת עבודה']].map(([v,lbl])=>(
          <button key={v} className={`ftab${types.has(v)?' active':''}`} onClick={()=>toggleType(v)}>{lbl}</button>
        ))}
      </div>
      <div className="vac-list">

          :list.map(v=><VacCard key={v.id} v={v} cats={state.cats} dispatch={dispatch} allTravelers={state.travelers} focusRef={v.id===focusVacId?focusRef:null} highlighted={v.id===focusVacId} onGoToPlanner={onGoToPlanner}/>)
        }
      </div>
      {addModal&&<AddVacManualModal onClose={()=>setAddModal(false)} onSave={vac=>{dispatch({t:'ADD_VAC',v:vac});setAddModal(false);}}/>}
    </div>
  );
}

function DashboardPage() {
  const {state}=useStore();
  const {vacations}=state;
  const years=useMemo(()=>[...new Set(vacations.map(v=>v.startDate.slice(0,4)))].sort((a,b)=>b-a),[vacations]);
  const [yearFilter,setYearFilter]=useState('all');
  const filtered=useMemo(()=>yearFilter==='all'?vacations:vacations.filter(v=>v.startDate.startsWith(yearFilter)),[vacations,yearFilter]);
  const totalILS=useMemo(()=>filtered.reduce((s,v)=>s+v.expenses.reduce((ss,e)=>ss+(e.amountILS||0),0),0),[filtered]);
  const byVac=useMemo(()=>filtered.filter(v=>v.expenses.length>0).map(v=>({name:v.name,v:v.expenses.reduce((s,e)=>s+(e.amountILS||0),0),type:v.type,startDate:v.startDate,endDate:v.endDate,countryName:v.countryName})).sort((a,b)=>b.startDate.localeCompare(a.startDate)),[filtered]);
  const byCat=useMemo(()=>{const m={};for(const v of filtered)for(const e of v.expenses)m[e.category]=(m[e.category]||0)+(e.amountILS||0);return Object.entries(m).map(([name,v])=>({name,v})).sort((a,b)=>b.v-a.v);},[filtered]);
  const stats=useMemo(()=>{
    const countDays=type=>filtered.filter(v=>v.type===type).reduce((s,v)=>{
      const a=new Date(v.startDate),b=new Date(v.endDate);
      return s+Math.round((b-a)/(1000*60*60*24))+1;
    },0);
    const paid=filtered.filter(v=>v.type==='paid'||v.type==='work');
    const countries=new Set(paid.filter(v=>v.countryCode).map(v=>v.countryCode));
    return {paid:countDays('paid'),planned:countDays('planned'),school:countDays('school'),countries:countries.size};
  },[filtered]);
  const daysByYear=useMemo(()=>{
    const m={};
    for(const v of vacations.filter(v=>v.type==='paid')){
      const yr=v.startDate.slice(0,4);
      const days=Math.round((new Date(v.endDate)-new Date(v.startDate))/(1000*60*60*24))+1;
      if(!m[yr]) m[yr]={total:0,il:0,abroad:0};
      m[yr].total+=days;
      if(v.countryCode==='IL') m[yr].il+=days; else m[yr].abroad+=days;
    }
    return Object.entries(m).sort((a,b)=>a[0]-b[0]).map(([name,r])=>({name,v:r.total,il:r.il,abroad:r.abroad}));
  },[vacations]);
  if(!vacations.length) return <div className="page"><h1 className="page-title">דאשבורד</h1><div className="empty">אין נתונים. הוסף חופשות והוצאות.</div></div>;
  return (
    <div className="page">
      <div className="page-header"><h1 className="page-title">דאשבורד</h1></div>
      <div className="filter-tabs" style={{marginBottom:16}}>
        <button className={`ftab${yearFilter==='all'?' active':''}`} onClick={()=>setYearFilter('all')}>כל השנים</button>
        {years.map(y=><button key={y} className={`ftab${yearFilter===y?' active':''}`} onClick={()=>setYearFilter(y)}>{y}</button>)}
      </div>

// ── Passport Scanner ───────────────────────────────────────────────────────
async function scanPassport(imageBase64, mediaType, apiKey) {
  const isPdf = mediaType === 'application/pdf';
  const contentBlock = isPdf
    ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:imageBase64}}
    : {type:'image', source:{type:'base64', media_type:mediaType, data:imageBase64}};
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'content-type':'application/json',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',
      max_tokens:1024,
      messages:[{role:'user',content:[
        contentBlock,
        {type:'text',text:`Extract passport data from this document. Return ONLY a JSON object with these fields:
{"firstNameEn":"given names in Latin","lastNameEn":"surname in Latin","firstNameHe":"given names in Hebrew if visible else empty","lastNameHe":"surname in Hebrew if visible else empty","passportNumber":"document number","birthDate":"YYYY-MM-DD","expiryDate":"YYYY-MM-DD","nationality":"country name in Hebrew"}
Return ONLY the JSON, no other text.`}
      ]}]
    })
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'שגיאת API');}
  const data=await res.json();
  const txt=data.content[0].text.trim();
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('לא ניתן לפרש תשובה');
  return JSON.parse(m[0]);
}

function ScanPassportModal({travelers, apiKey, onClose, onSave}) {
  const [step,setStep]=useState('upload'); // upload | scanning | confirm
  const [err,setErr]=useState('');
  const [extracted,setExtracted]=useState(null);
  const [matchedTraveler,setMatchedTraveler]=useState(null); // existing traveler match
  const [f,setF]=useState({firstNameHe:'',lastNameHe:'',firstNameEn:'',lastNameEn:'',birthDate:'',passportNumber:'',expiryDate:'',nationality:''});
  const fileRef=useRef();

  async function handleFile(e){
    const file=e.target.files[0];
    if(!file) return;
    if(!apiKey){setErr('הגדר מפתח Anthropic בהגדרות תחילה.');return;}
    setStep('scanning'); setErr('');
    try {
      const reader=new FileReader();
      reader.onload=async(ev)=>{
        try {
          const b64=ev.target.result.split(',')[1];
          const mt=file.type||'image/jpeg';
          const info=await scanPassport(b64,mt,apiKey);
          setExtracted(info);
          const filled={
            firstNameHe:info.firstNameHe||'',lastNameHe:info.lastNameHe||'',
            firstNameEn:info.firstNameEn||'',lastNameEn:info.lastNameEn||'',
            birthDate:info.birthDate||'',passportNumber:info.passportNumber||'',
            expiryDate:info.expiryDate||'',nationality:info.nationality||''
          };
          setF(filled);
          // try to match existing traveler by last name + first name (case insensitive)
          const match=travelers.find(t=>{
            const enMatch=info.lastNameEn&&t.lastNameEn&&t.lastNameEn.toLowerCase()===info.lastNameEn.toLowerCase();
            const heMatch=info.lastNameHe&&t.lastNameHe&&t.lastNameHe===info.lastNameHe;
            return enMatch||heMatch;
          });
          setMatchedTraveler(match||null);
          setStep('confirm');
        } catch(ex){setErr(ex.message);setStep('upload');}
      };
      reader.readAsDataURL(file);
    } catch(ex){setErr(ex.message);setStep('upload');}
  }

  function save(useExisting){
    const passport={id:genId(),country:f.nationality,number:f.passportNumber,expiry:f.expiryDate,photoUrl:''};
    if(useExisting&&matchedTraveler){
      onSave({mode:'addPassport',travelerId:matchedTraveler.id,passport});
    } else {
      const traveler={firstNameHe:f.firstNameHe,lastNameHe:f.lastNameHe,firstNameEn:f.firstNameEn,lastNameEn:f.lastNameEn,birthDate:f.birthDate};
      onSave({mode:'newTraveler',traveler,passport});
    }
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
        <h2>📷 סריקת דרכון</h2>
        {step==='upload'&&(
          <>
            <p style={{color:'var(--text2)',fontSize:14,marginBottom:16}}>העלה תמונה או PDF של הדרכון — Claude יחלץ את הפרטים אוטומטית.</p>
            {err&&<div style={{color:'#EF4444',fontSize:13,marginBottom:12}}>⚠️ {err}</div>}
            <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={handleFile}/>
            <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>בחר תמונה או PDF</button>
          </>
        )}
        {step==='scanning'&&(
          <div style={{textAlign:'center',padding:'32px 0',color:'var(--text2)'}}>
            <div style={{fontSize:32,marginBottom:12}}>🔍</div>
            <div>סורק דרכון...</div>
          </div>
        )}
        {step==='confirm'&&(
          <>
            {matchedTraveler&&(
              <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:8,padding:10,marginBottom:14,fontSize:13}}>
                ✅ נמצא נוסע קיים: <strong>{matchedTraveler.firstNameHe||matchedTraveler.firstNameEn} {matchedTraveler.lastNameHe||matchedTraveler.lastNameEn}</strong> — הדרכון יתווסף אליו.
              </div>
            )}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div className="fg"><label>שם פרטי (עברית)</label><input className="input" value={f.firstNameHe} onChange={e=>setF({...f,firstNameHe:e.target.value})}/></div>
              <div className="fg"><label>שם משפחה (עברית)</label><input className="input" value={f.lastNameHe} onChange={e=>setF({...f,lastNameHe:e.target.value})}/></div>
              <div className="fg"><label>First Name</label><input className="input" dir="ltr" value={f.firstNameEn} onChange={e=>setF({...f,firstNameEn:e.target.value})}/></div>
              <div className="fg"><label>Last Name</label><input className="input" dir="ltr" value={f.lastNameEn} onChange={e=>setF({...f,lastNameEn:e.target.value})}/></div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              <div className="fg"><label>תאריך לידה</label><input className="input" type="date" value={f.birthDate} onChange={e=>setF({...f,birthDate:e.target.value})}/></div>
              <div className="fg"><label>מספר דרכון</label><input className="input" dir="ltr" value={f.passportNumber} onChange={e=>setF({...f,passportNumber:e.target.value})}/></div>
              <div className="fg"><label>תוקף עד</label><input className="input" type="date" value={f.expiryDate} onChange={e=>setF({...f,expiryDate:e.target.value})}/></div>
            </div>
            <div className="fg"><label>אזרחות</label><input className="input" value={f.nationality} onChange={e=>setF({...f,nationality:e.target.value})}/></div>
            <div className="modal-actions" style={{flexWrap:'wrap',gap:8}}>
              <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
              {matchedTraveler&&<button className="btn btn-primary" onClick={()=>save(true)}>הוסף לנוסע קיים</button>}
              <button className={matchedTraveler?'btn btn-secondary':'btn btn-primary'} onClick={()=>save(false)}>צור נוסע חדש</button>

  );
}

async function uploadPassportPhoto(file, passportId, onProgress) {
  const ext = file.name.split('.').pop().toLowerCase();
  const ref = storage.ref(`passport-photos/${passportId}.${ext}`);
  return new Promise((resolve, reject) => {
    const task = ref.put(file);
    const timeout = setTimeout(()=>{ task.cancel(); reject(new Error('timeout — העלאה ארכה יותר מ-120 שניות')); }, 120000);
    task.on('state_changed',
      snap => { if(onProgress) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      err => { clearTimeout(timeout); reject(err); },
      async () => {
        clearTimeout(timeout);
        try { resolve(await ref.getDownloadURL()); }
        catch(e) { reject(e); }
      }
    );
  });
}

async function deletePassportPhoto(passportId) {
  try {
    // נסה למחוק קבצים עם סיומות נפוצות
    for (const ext of ['jpg','jpeg','png','pdf','heic']) {
      try { await storage.ref(`passport-photos/${passportId}.${ext}`).delete(); break; } catch(e){}
    }
  } catch(e) {}
}

function PassportModal({passport, onClose, onSave}) {
  const blank = {country:'',number:'',expiry:'',photoUrl:''};
  const [f, setF] = useState(passport ? {country:passport.country||'',number:passport.number||'',expiry:passport.expiry||'',photoUrl:passport.photoUrl||''} : blank);
  const [uploading, setUploading] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [preview, setPreview] = useState(passport?.photoUrl||'');
  const fileRef = useRef();

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setPendingFile(file);
    if (file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      setPreview(url);
    } else {
      setPreview('pdf');
    }
  }

  const [err, setErr] = useState('');
  const [progress, setProgress] = useState(null);

  async function handleSave() {
    setUploading(true);
    setErr('');
    setProgress(null);
    try {
      let photoUrl = f.photoUrl;
      if (pendingFile) {
        const ppId = passport?.id || genId();
        photoUrl = await uploadPassportPhoto(pendingFile, ppId, pct => setProgress(pct));
        onSave({...f, photoUrl}, ppId);
      } else {
        onSave(f, null);
      }
    } catch(e) {
      console.error('שגיאת העלאה:', e);
      setErr(e.message || 'שגיאה לא ידועה');
    } finally {
      setUploading(false);
      setProgress(null);
    }
  }

  const hasPhoto = preview && preview !== '';

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{passport?'עריכת דרכון':'הוסף דרכון'}</h2>
        <div className="fg"><label>מדינה</label>
          <select className="input" value={f.country} onChange={e=>setF({...f,country:e.target.value})}>
            <option value="">בחר מדינה...</option>
            {[...COUNTRIES].sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=><option key={c.code} value={c.name}>{c.name}</option>)}
          </select>
        </div>
        <div className="fg"><label>מספר דרכון</label><input className="input" dir="ltr" value={f.number} onChange={e=>setF({...f,number:e.target.value})}/></div>
        <div className="fg"><label>תוקף עד</label><input className="input" type="date" value={f.expiry} onChange={e=>setF({...f,expiry:e.target.value})}/></div>
        <div className="fg">
          <label>צילום דרכון</label>
          <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={handleFile}/>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button className="btn btn-secondary" onClick={()=>fileRef.current.click()} disabled={uploading}>
              {hasPhoto ? '🔄 החלף קובץ' : '📎 צרף קובץ'}
            </button>
            {hasPhoto && <button className="btn btn-secondary" style={{color:'var(--red)'}} onClick={()=>{setPreview('');setPendingFile(null);setF({...f,photoUrl:''});}}>הסר</button>}
          </div>

async function uploadDocFile(file, docId, onProgress) {
  const ext = file.name.split('.').pop().toLowerCase();
  const ref = storage.ref(`doc-files/${docId}.${ext}`);
  return new Promise((resolve, reject) => {
    const task = ref.put(file);
    const timeout = setTimeout(()=>{ task.cancel(); reject(new Error('timeout — העלאה ארכה יותר מ-120 שניות')); }, 120000);
    task.on('state_changed',
      snap => { if(onProgress) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      err => { clearTimeout(timeout); reject(err); },
      async () => {
        clearTimeout(timeout);
        try { resolve(await ref.getDownloadURL()); }
        catch(e) { reject(e); }
      }
    );
  });
}

async function uploadVacDoc(file, docId, onProgress) {
  const ext = file.name.split('.').pop().toLowerCase();
  const ref = storage.ref(`vac-docs/${docId}.${ext}`);
  return new Promise((resolve, reject) => {
    const task = ref.put(file);
    const timeout = setTimeout(()=>{ task.cancel(); reject(new Error('timeout')); }, 120000);
    task.on('state_changed',
      snap => { if(onProgress) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      err => { clearTimeout(timeout); reject(err); },
      async () => { clearTimeout(timeout); try { resolve(await ref.getDownloadURL()); } catch(e){ reject(e); } }
    );
  });
}

function DocModal({doc, docTypes, onClose, onSave}) {

  const [f, setF] = useState(doc ? {type:doc.type||'',number:doc.number||'',expiry:doc.expiry||'',fileUrl:doc.fileUrl||''} : blank);

  const [err, setErr] = useState('');

  const fileRef = useRef();

  function handleFile(e) {
    const file = e.target.files[0];
    if(!file) return;
    setPendingFile(file);
    setPreview(file.type.startsWith('image/') ? URL.createObjectURL(file) : 'pdf');
  }

  async function handleSave() {
    if(!f.type) return;
    setUploading(true); setErr(''); setProgress(null);

      let fileUrl = f.fileUrl;

        onSave({...f, fileUrl}, id);

        onSave(f, null);

      setUploading(false); setProgress(null);
