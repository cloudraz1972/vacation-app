  const {state} = useStore();
  const [itinerary, setItinerary] = useState({}); // {dateStr: [{id,time,icon,text}]}
  const [dayNotes, setDayNotes] = useState({}); // {dateStr: string}
  const [spans, setSpans] = useState([]); // [{id,icon,text,startDate,endDate,color}]
  const [viewMode, setViewMode] = useState('day'); // 'day' | 'gantt'
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const saveTimer = useRef(null);

  const allVacs = useMemo(()=>
    [...state.vacations]
      .filter(v=>['planned','paid','work'].includes(v.type))
      .sort((a,b)=>a.startDate.localeCompare(b.startDate)),
    [state.vacations]
  );
  const years = useMemo(()=>[...new Set(allVacs.map(v=>v.startDate.slice(0,4)))].sort((a,b)=>b-a), [allVacs]);
  const [yearFilter, setYearFilter] = useState(()=>String(new Date().getFullYear()));
  const vacs = useMemo(()=>allVacs.filter(v=>!yearFilter||v.startDate.startsWith(yearFilter)), [allVacs,yearFilter]);
  const [selVacId, setSelVacId] = useState(plannerVacId||null);
  // אם הגענו מקישור חופשה — ודא שהשנה מסוננת נכון
  useEffect(()=>{
    if(!plannerVacId) return;
    const vac = allVacs.find(v=>v.id===plannerVacId);
    if(vac){ setYearFilter(vac.startDate.slice(0,4)); setSelVacId(plannerVacId); setSelDay(null); }
  },[plannerVacId]);
  const selVac = (selVacId && vacs.find(v=>v.id===selVacId)) || vacs[0] || null;

  // ימים של החופשה הנבחרת
  const days = useMemo(()=> selVac ? dateRange(selVac.startDate, selVac.endDate) : [], [selVac]);
  const [selDay, setSelDay] = useState(null);
  const activeDay = selDay && days.includes(selDay) ? selDay : days[0] || null;

  // טעינה מ-Firestore
  useEffect(()=>{
    ITINERARY_DOC.get().then(doc=>{
      setItinerary(doc.exists ? (doc.data().days||{}) : {});
      setDayNotes(doc.exists ? (doc.data().notes||{}) : {});
      setSpans(doc.exists ? (doc.data().spans||[]) : []);
      setLoaded(true);
    }).catch(()=>setLoaded(true));
  },[]);

  function saveItinerary(next, notes, nextSpans) {
    if(!loaded) return; // אל תשמור לפני שהנתונים נטענו
    const nextNotes = notes !== undefined ? notes : dayNotes;
    const saveSpans = nextSpans !== undefined ? nextSpans : spans;
    setItinerary(next);
    if(notes !== undefined) setDayNotes(notes);
    if(nextSpans !== undefined) setSpans(nextSpans);
    clearTimeout(saveTimer.current);
    setSaving(true);
    saveTimer.current = setTimeout(async ()=>{
      try { await ITINERARY_DOC.set({days: next, notes: nextNotes, spans: saveSpans}); }
      catch(e) { alert('שגיאה בשמירה: '+e.message); }
      setSaving(false);
    }, 800);
  }

  function addSpan(sp) { saveItinerary(itinerary, undefined, [...spans, {...sp, id:genId()}]); }
  function delSpan(id) { saveItinerary(itinerary, undefined, spans.filter(s=>s.id!==id)); }
  function updSpan(id, u) { saveItinerary(itinerary, undefined, spans.map(s=>s.id===id?{...s,...u}:s)); }

  function addActivity(act) {
    const list = [...(itinerary[activeDay]||[]), {...act, id:genId()}];
    list.sort((a,b)=>a.time.localeCompare(b.time));
    saveItinerary({...itinerary, [activeDay]: list});
  }
  function delActivity(id) {
    const list = (itinerary[activeDay]||[]).filter(a=>a.id!==id);
    saveItinerary({...itinerary, [activeDay]: list});
  }
  function updActivity(id, u) {
    const list = (itinerary[activeDay]||[]).map(a=>a.id===id?{...a,...u}:a);
    list.sort((a,b)=>a.time.localeCompare(b.time));
    saveItinerary({...itinerary, [activeDay]: list});
  }

  // ── add-row state ──
  const [newTime, setNewTime] = useState('09:00');
  const [newIcon, setNewIcon] = useState('🏨');
  const [newText, setNewText] = useState('');
  const [showIconPicker, setShowIconPicker] = useState(false);

  function handleAdd() {
    if (!newText.trim() || !activeDay) return;
    addActivity({time:newTime, icon:newIcon, text:newText.trim()});
    setNewText('');
  }

  // צבע החופשה הנבחרת
  const vacColor = selVac ? COLORS[selVac.type] : '#3B82F6';

  if (!loaded) return <div className="page"><div className="empty">טוען...</div></div>;

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">📅 תכנון יומי</h1>
        {saving && <span style={{fontSize:12,color:'var(--text2)'}}>שומר...</span>}
      </div>

      {allVacs.length === 0 ? (
        <div className="empty">אין חופשות. הוסף חופשות בלוח השנה.</div>
      ) : (<>
        {/* שורת בחירה: שנה + דרופדאון */}
        <div className="dp-selector-row">
          <div className="dp-year-tabs">
            {years.map(y=>(
              <button key={y} className={`dp-year-tab${yearFilter===y?' active':''}`}
                onClick={()=>{setYearFilter(y);setSelVacId(null);setSelDay(null);}}>
                {y}
              </button>
            ))}
          </div>
          <select className="dp-select"
            value={selVac?.id||''}
            onChange={e=>{setSelVacId(e.target.value);setSelDay(null);}}>
            {vacs.map(v=>(
              <option key={v.id} value={v.id}>{v.name} ({fmtDate(v.startDate)})</option>
            ))}
          </select>
        </div>

        {/* ציר ימים */}
        {selVac && days.length > 0 && (
          <div className="dp-days-rail">
            {days.map((ds,i)=>{
              const hasPlan = (itinerary[ds]||[]).length > 0;
              const isActive = ds === activeDay;
              const d = new Date(ds);
              return (
                <div key={ds} className="dp-day-dot" onClick={()=>setSelDay(ds)}>
                  <div className="dp-day-bubble" style={{
                    background: isActive ? vacColor : hasPlan ? vacColor+'22' : 'var(--bg)',
                    borderColor: isActive ? vacColor : hasPlan ? vacColor : 'var(--border)',
                    color: isActive ? '#fff' : hasPlan ? vacColor : 'var(--text2)',
                    borderRadius: isActive ? '22px' : '12px',
                  }}>
                    <span className="dp-day-num">{i+1}</span>
                    <span className="dp-day-date">{d.getDate()}/{d.getMonth()+1}</span>
                  </div>
                  <span className="dp-day-label">{['א','ב','ג','ד','ה','ו','ש'][d.getDay()]}</span>
                </div>
              );
            })}
          </div>
        )}

        {/* גאנט מוטמע — מחבר בין ציר הימים לפירוט היום */}
        {selVac && days.length > 0 && (
          <GanttView
            days={days}
            spans={spans}
            itinerary={itinerary}
            vacColor={vacColor}
            activeDay={activeDay}
            onDayClick={ds=>setSelDay(ds)}
            onAddSpan={addSpan}
            onDelSpan={delSpan}
            onUpdSpan={updSpan}
            embedded={true}
          />
        )}

        {/* כרטיס יום */}
        {activeDay && selVac && (()=>{
          const d = new Date(activeDay);
          const dayNum = days.indexOf(activeDay)+1;
          const dayName = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][d.getDay()];
          const activities = itinerary[activeDay] || [];
          return (
            <div className="dp-card">
              <div className="dp-card-title" style={{color:vacColor}}>
                יום {dayNum} — {dayName}, {fmtDate(activeDay)}
              </div>
              <div className="dp-card-sub">
                {selVac.name}{selVac.countryName ? ` · ${selVac.countryName}` : ''}
              </div>
              <textarea
                className="input"
                placeholder="הוסף תיאור ליום..."
                value={dayNotes[activeDay]||''}
                onChange={e=>{
                  const next={...dayNotes,[activeDay]:e.target.value};
                  saveItinerary(itinerary, next);
                }}
                rows={2}
                style={{marginTop:8,marginBottom:4,fontSize:13,resize:'vertical',width:'100%',boxSizing:'border-box'}}
              />

              {/* ציר זמן אנכי */}
              {activities.length === 0
                ? <div className="dp-empty">אין פעילויות ליום זה. הוסף למטה.</div>
                : <div className="dp-timeline">
                    {activities.map(a=>(
                      <ActivityRow key={a.id} act={a} color={vacColor}
                        onDel={()=>delActivity(a.id)}
                        onUpd={u=>updActivity(a.id,u)}/>
                    ))}
                  </div>
              }

              {/* שורת הוספה */}
              <div className="dp-add-row">
                <input type="time" className="input input-sm" value={newTime}
                  onChange={e=>setNewTime(e.target.value)} style={{width:90}}/>
                <div style={{position:'relative'}}>
                  <button className="btn btn-secondary btn-sm" style={{fontSize:18,padding:'4px 10px'}}
                    onClick={()=>setShowIconPicker(p=>!p)}>{newIcon}</button>
                  {showIconPicker && (
                    <div style={{position:'absolute',top:'110%',right:0,zIndex:50,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:8,display:'flex',flexWrap:'wrap',gap:4,width:220,boxShadow:'var(--shm)'}}>
                      {ACTIVITY_ICONS.map(ic=>(
                        <button key={ic} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,padding:2,borderRadius:4}}
                          onClick={()=>{setNewIcon(ic);setShowIconPicker(false);}}>{ic}</button>
                      ))}
                    </div>
                  )}
                </div>
                <input className="input input-sm" placeholder="תיאור פעילות..." value={newText}
                  onChange={e=>setNewText(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&handleAdd()}
                  style={{flex:1,minWidth:140}}/>
                <button className="btn btn-primary btn-sm" onClick={handleAdd}>+ הוסף</button>
              </div>
            </div>
          );
        })()}
      </>)}
    </div>
  );
}

function GanttView({days, spans, itinerary, vacColor, activeDay, onDayClick, onAddSpan, onDelSpan, onUpdSpan, embedded}) {
  // drag: null | {type:'create',anchor,cur} | {type:'resize-end',id,fixedStart,cur} | {type:'resize-start',id,fixedEnd,cur}
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const didDragRef = useRef(false); // האם הייתה גרירה אמיתית (למנוע click אחרי drag)
  const cbRef = useRef({onUpdSpan}); // ref לcallbacks כדי למנוע stale closure
  const [form, setForm] = useState(null);
  const [editId, setEditId] = useState(null);
  const [showIconPicker, setShowIconPicker] = useState(false);

  const daySet = new Set(days);
  const DOW_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const LANE_H = embedded?20:24, LANE_GAP = 3, DAY_H = embedded?24:30;

  // עדכן ref בכל render כדי שה-window handlers תמיד ישתמשו בגרסה הנוכחית
  useEffect(()=>{ cbRef.current = {onUpdSpan}; });
  // שמור ref מסונכרן עם state drag
  useEffect(()=>{ dragRef.current = drag; },[drag]);

  // Window-level mouse + touch tracking
  useEffect(()=>{
    function getDayAt(x,y){
      const el = document.elementFromPoint(x,y);
      return el?.closest('[data-day]')?.getAttribute('data-day') || null;
    }
    function coords(e){ // מחזיר {x,y} ממאוס או מגע
      const t = e.touches?.[0] || e.changedTouches?.[0];
      return t ? {x:t.clientX, y:t.clientY} : {x:e.clientX, y:e.clientY};
    }
    function onMove(e){
      const d = dragRef.current;
      if(!d) return;
      if(e.cancelable) e.preventDefault(); // מונע גלילה במובייל
      const {x,y} = coords(e);
      const ds = getDayAt(x,y);
      if(!ds) return;
      if(d.cur === ds) return;
      didDragRef.current = true;
      setDrag(prev => prev ? {...prev, cur:ds} : prev);
    }
    function onUp(e){
      const d = dragRef.current;
      if(!d) return;
      const {x,y} = coords(e);
      const ds = getDayAt(x,y) || d.cur;
      const wasDrag = didDragRef.current;
      didDragRef.current = false;
      if(d.type === 'create'){
        const [s,en] = ds>=d.anchor ? [d.anchor,ds] : [ds,d.anchor];
        if(s && wasDrag) { setForm({icon:'🤿',text:'',startDate:s,endDate:en||s,color:SPAN_COLORS[0]}); setEditId(null); }
      } else if(d.type === 'resize-end'){
        const newEnd = ds>=d.fixedStart ? ds : d.fixedStart;
        cbRef.current.onUpdSpan(d.id, {endDate:newEnd});
      } else if(d.type === 'resize-start'){
        const newStart = ds<=d.fixedEnd ? ds : d.fixedEnd;
        cbRef.current.onUpdSpan(d.id, {startDate:newStart});
      }
      setDrag(null);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onUp);
    return ()=>{
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  },[]); // eslint-disable-line

  // בנה שבועות
  const firstDate = new Date(days[0]+'T12:00:00');
  const lastDate  = new Date(days[days.length-1]+'T12:00:00');
  const gStart = new Date(firstDate); gStart.setDate(gStart.getDate() - gStart.getDay());
  const gEnd   = new Date(lastDate);  gEnd.setDate(gEnd.getDate() + (6 - gEnd.getDay()));
  const gridDays = [];
  for(let d=new Date(gStart); d<=gEnd; d.setDate(d.getDate()+1)) gridDays.push(d.toISOString().slice(0,10));
  const weeks = [];
  for(let i=0; i<gridDays.length; i+=7) weeks.push(gridDays.slice(i,i+7));

  function assignLanes(spList){
    const lanes=[];
    return [...spList].sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(sp=>{
      let lane=lanes.findIndex(end=>end<sp.startDate);
      if(lane<0){lane=lanes.length;lanes.push('');}
      lanes[lane]=sp.endDate;
      return {...sp,lane};
    });
  }

  // חישוב drag overlay — מה להציג בזמן גרירה
  function getOverlay(){
    if(!drag) return null;
    if(drag.type==='create'){
      const [s,e]= drag.cur>=drag.anchor?[drag.anchor,drag.cur]:[drag.cur,drag.anchor];
      return {type:'create',start:s,end:e};
    }
    if(drag.type==='resize-end'){
      return {type:'resize',id:drag.id,start:drag.fixedStart,end:drag.cur>=drag.fixedStart?drag.cur:drag.fixedStart};
    }
    if(drag.type==='resize-start'){
      return {type:'resize',id:drag.id,start:drag.cur<=drag.fixedEnd?drag.cur:drag.fixedEnd,end:drag.fixedEnd};
    }
  }
  const overlay = getOverlay();

  function isDragHighlight(ds){
    if(!overlay||overlay.type!=='create') return false;
    return ds>=overlay.start && ds<=overlay.end;
  }

  function handleWeekDown(e){
    const touch = e.touches?.[0];
    const target = touch
      ? document.elementFromPoint(touch.clientX, touch.clientY)
      : e.target;
    if(!target) return;
    // בדוק resize handle
    const handle = target.closest('[data-resize]');
    if(handle){
      const spanId=handle.getAttribute('data-span-id');
      const dir=handle.getAttribute('data-resize');
      const sp=spans.find(s=>s.id===spanId);
      if(sp){
        e.preventDefault();
        setDrag(dir==='end'
          ? {type:'resize-end',id:spanId,fixedStart:sp.startDate,cur:sp.endDate}
          : {type:'resize-start',id:spanId,fixedEnd:sp.endDate,cur:sp.startDate});
        return;
      }
    }
    // אל תתחיל create אם לוחצים על בר
    if(target.closest('[data-span-bar]')) return;
    // create drag
    const cell=target.closest('[data-day]');
    if(cell){
      const ds=cell.getAttribute('data-day');
      if(daySet.has(ds)){ e.preventDefault(); setDrag({type:'create',anchor:ds,cur:ds}); }
    }
  }

  function openEdit(sp){
    setEditId(sp.id);
    setForm({icon:sp.icon,text:sp.text,startDate:sp.startDate,endDate:sp.endDate,color:sp.color});
  }
  function handleSave(){
    if(!form?.text.trim()) return;
    if(editId) onUpdSpan(editId,form); else onAddSpan(form);
    setForm(null); setEditId(null);
  }

  function renderBar(sp, week, lane){
    const wStart=week[0], wEnd=week[6];
    // אם יש overlay resize על בר זה — השתמש בתאריכים של ה-overlay
    const disp = overlay?.type==='resize'&&overlay.id===sp.id ? {...sp,startDate:overlay.start,endDate:overlay.end} : sp;
    const barStart=disp.startDate<wStart?wStart:disp.startDate;
    const barEnd  =disp.endDate>wEnd?wEnd:disp.endDate;
    const si=new Date(barStart+'T12:00:00').getDay();
    const ei=new Date(barEnd+'T12:00:00').getDay();
    if(ei<si) return null; // לא מוצג בשבוע זה אחרי resize
    const right=(si/7*100)+'%';
    const width=((ei-si+1)/7*100)+'%';
    const top=DAY_H+lane*(LANE_H+LANE_GAP)+2;
    const startsHere=disp.startDate>=wStart;
    const endsHere=disp.endDate<=wEnd;
    const br=`${endsHere?5:0}px ${startsHere?5:0}px ${startsHere?5:0}px ${endsHere?5:0}px`;
    return (
      <div key={sp.id} data-span-bar="1"
        style={{position:'absolute',right,width,top,height:LANE_H,background:sp.color,borderRadius:br,
          display:'flex',alignItems:'center',overflow:'hidden',boxSizing:'border-box',zIndex:2,
          paddingRight:startsHere?20:2,paddingLeft:endsHere?20:2,
          fontSize:12,fontWeight:700,color:'#fff',cursor:'pointer',userSelect:'none'}}
        onClick={e=>{if(!drag){e.stopPropagation();openEdit(sp);}}}>
        {/* ידית resize ימין (הארכת התחלה) */}
        {startsHere&&(
          <div data-resize="start" data-span-id={sp.id}
            style={{position:'absolute',right:0,top:0,bottom:0,width:12,cursor:'ew-resize',
              background:'rgba(0,0,0,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,flexShrink:0}}
            onMouseDown={e=>{e.preventDefault();e.stopPropagation();setDrag({type:'resize-start',id:sp.id,fixedEnd:sp.endDate,cur:sp.startDate});}}
            onTouchStart={e=>{e.preventDefault();e.stopPropagation();setDrag({type:'resize-start',id:sp.id,fixedEnd:sp.endDate,cur:sp.startDate});}}>⋮</div>
        )}
        {startsHere&&<span style={{marginLeft:4}}>{sp.icon}</span>}
        <span style={{overflow:'hidden',textOverflow:'ellipsis',flex:1,textAlign:'center'}}>{sp.text}</span>
        {endsHere&&startsHere&&(
          <button style={{background:'none',border:'none',color:'rgba(255,255,255,.8)',cursor:'pointer',fontSize:11,padding:'0 2px',flexShrink:0}}
            onClick={e=>{e.stopPropagation();onDelSpan(sp.id);}}>✕</button>
        )}
        {/* ידית resize שמאל (הארכת סיום) */}
        {endsHere&&(
          <div data-resize="end" data-span-id={sp.id}
            style={{position:'absolute',left:0,top:0,bottom:0,width:12,cursor:'ew-resize',
              background:'rgba(0,0,0,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,flexShrink:0}}
            onMouseDown={e=>{e.preventDefault();e.stopPropagation();setDrag({type:'resize-end',id:sp.id,fixedStart:sp.startDate,cur:sp.endDate});}}
            onTouchStart={e=>{e.preventDefault();e.stopPropagation();setDrag({type:'resize-end',id:sp.id,fixedStart:sp.startDate,cur:sp.endDate});}}>⋮</div>
        )}
      </div>
    );
  }

  return (
    <div className="gcal" style={{cursor:drag?'crosshair':'default', borderRadius:embedded?0:undefined, borderLeft:'none', borderRight:'none', marginBottom:embedded?12:0}}>
      <div className="gcal-header">
        {DOW_HE.map(d=><div key={d} className="gcal-dow">{d}</div>)}
      </div>

      {weeks.map((week,wi)=>{
        const wStart=week[0], wEnd=week[6];
        const wSpans=spans.filter(sp=>sp.endDate>=wStart&&sp.startDate<=wEnd);
        const assigned=assignLanes(wSpans);
        const numLanes=assigned.reduce((m,s)=>Math.max(m,s.lane),-1)+1;
        const spH=numLanes>0?numLanes*(LANE_H+LANE_GAP)+4:0;
        const rowH=DAY_H+spH+6;

        return (
          <div key={wi} className="gcal-week" style={{minHeight:rowH}}
            onMouseDown={handleWeekDown}
            onTouchStart={handleWeekDown}>
            {week.map(ds=>{
              const inVac=daySet.has(ds);
              const d=new Date(ds+'T12:00:00');
              const isActive=ds===activeDay;
              const hi=isDragHighlight(ds);
              const actCnt=(itinerary[ds]||[]).length;
              return (
                <div key={ds} data-day={ds} className="gcal-cell"
                  onClick={()=>{
                    if(!inVac||didDragRef.current) return;
                    if(embedded) { onDayClick(ds); return; } // במצב מוטמע — בחר יום
                    setForm({icon:'🤿',text:'',startDate:ds,endDate:ds,color:SPAN_COLORS[0]});
                    setEditId(null);
                  }}
                  style={{
                    background: hi?vacColor+'55':isActive?vacColor+'22':!inVac?'var(--bg)':'var(--surface)',
                    opacity:inVac?1:0.45,
                    cursor:inVac?(drag?'crosshair':'pointer'):'default',
                  }}>
                  <div className="gcal-cell-top">
                    <span className={`gcal-day-num${isActive?' active':''}`}
                      style={{color:isActive?vacColor:undefined,
                        background:isActive?vacColor+'22':'none',
                        borderRadius:4,padding:'1px 3px',cursor:inVac?'pointer':'default'}}
                      onClick={e=>{e.stopPropagation();if(inVac) onDayClick(ds);}}>
                      {d.getDate()}
                    </span>
                    {actCnt>0&&inVac&&(
                      <span className="gcal-act-badge" style={{background:vacColor}}>{actCnt}</span>
                    )}
                  </div>
                </div>
              );
            })}

            {assigned.map(sp=>renderBar(sp, week, sp.lane))}
          </div>
        );
      })}

            עד<input type="date" className="input input-sm" value={form.endDate}

          <button className="btn btn-secondary btn-sm" onClick={()=>{setForm(null);setEditId(null);}}>ביטול</button>

function ExpiryWarningBanner() {
  const {state} = useContext(Ctx);
  const [dismissed, setDismissed] = useState(false);
  const warnings = useMemo(()=>{
    const today = new Date();
    const limit = new Date(today);
    limit.setMonth(limit.getMonth()+5);
    const out = [];
    (state.travelers||[]).forEach(t=>{
      const name = [t.firstNameHe,t.lastNameHe].filter(Boolean).join(' ') || [t.firstNameEn,t.lastNameEn].filter(Boolean).join(' ') || 'נוסע';
      (t.passports||[]).forEach(pp=>{
        if(!pp.expiry) return;
        const exp = new Date(pp.expiry);
        if(exp<=limit){
          const daysLeft = Math.ceil((exp-today)/(1000*60*60*24));
          out.push({name, docLabel:`דרכון ${pp.country||''}`.trim(), expiry:pp.expiry, daysLeft});
        }
      });
      (t.docs||[]).forEach(d=>{
        if(!d.expiry) return;
        const exp = new Date(d.expiry);
        if(exp<=limit){
          const daysLeft = Math.ceil((exp-today)/(1000*60*60*24));
          out.push({name, docLabel:d.type||'תעודה', expiry:d.expiry, daysLeft});
        }
      });
    });
    return out.sort((a,b)=>a.daysLeft-b.daysLeft);
  },[state.travelers]);

  if(!warnings.length||dismissed) return null;
  return (
    <div className="expiry-banner">
      <div className="expiry-banner-title">⚠️ תעודות הקרובות לפקיעת תוקף</div>
      {warnings.map((w,i)=>{
        const urgent = w.daysLeft<=60;
        const label = w.daysLeft<0 ? `פג תוקף לפני ${Math.abs(w.daysLeft)} ימים!`
                    : w.daysLeft===0 ? 'פג תוקף היום!'
                    : `עוד ${w.daysLeft} ימים (${fmtDate(w.expiry)})`;
        return (
          <div key={i} className={`expiry-banner-item${urgent?' urgent':''}`}>
            {urgent?'🔴':'🟡'} <strong>{w.name}</strong> — {w.docLabel} — {label}
          </div>
        );
      })}
      <button className="expiry-banner-dismiss" onClick={()=>setDismissed(true)}>הסתר</button>
    </div>
  );
}

// ── Wish List ──────────────────────────────────────────────────────────────
const WISH_PRIORITY = [
  {key:'hot',   label:'🔥 חם',    color:'#EF4444'},
  {key:'dream', label:'⭐ חלום',  color:'#F59E0B'},
  {key:'maybe', label:'💭 אולי',  color:'#94A3B8'},
];
const WISH_PRIORITY_MAP = Object.fromEntries(WISH_PRIORITY.map(p=>[p.key,p]));

function WishModal({item, onClose, onSave}) {
  const empty = {name:'',countryCode:'',countryName:'',priority:'dream',estimatedDays:'',composition:'',notes:''};
  const [f,setF] = useState(item ? {...item} : empty);
  function save() {
    if(!f.name.trim()) return;
    const cn = COUNTRIES.find(c=>c.code===f.countryCode);
    onSave({...f, countryName: cn?.name||f.countryName||''});
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{item ? 'עריכת חלום' : '✨ הוספת חלום לחופשה'}</h2>
        <div className="fg">
          <label>שם החופשה / יעד</label>
          <input className="input" value={f.name} autoFocus onChange={e=>setF({...f,name:e.target.value})} placeholder='לדוגמא: יפן בסתיו'/>
        </div>
        <div className="fg">
          <label>מדינה (אופציונלי)</label>
          <select className="input" value={f.countryCode} onChange={e=>setF({...f,countryCode:e.target.value})}>
            <option value="">בחר מדינה...</option>
            {[...COUNTRIES].sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=>(
              <option key={c.code} value={c.code}>{c.name}</option>
            ))}
          </select>
        </div>
        <div className="fg">
          <label>עדיפות</label>
          <div style={{display:'flex',gap:8}}>
            {WISH_PRIORITY.map(p=>(
              <button key={p.key}
                className={`type-btn${f.priority===p.key?' active':''}`}
                style={{'--tc':p.color}}
                onClick={()=>setF({...f,priority:p.key})}>{p.label}</button>
            ))}
          </div>
        </div>
        <div className="form-row">
          <div className="fg">
            <label>משך משוער (ימים)</label>
            <input className="input" type="number" min="1" value={f.estimatedDays} onChange={e=>setF({...f,estimatedDays:e.target.value})} placeholder='7'/>
          </div>
          <div className="fg">
            <label>הרכב</label>
            <select className="input" value={f.composition} onChange={e=>setF({...f,composition:e.target.value})}>
              <option value="">בחר הרכב...</option>
              {['רז','אלינור','זוגי','משפחתי'].map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
        </div>
        <div className="fg">
          <label>הערות / רעיונות</label>
          <textarea className="input" rows="3" value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} placeholder='למה רוצים לנסוע, מה לעשות שם...' style={{resize:'vertical'}}/>
        </div>

          <button className="btn btn-primary" onClick={save}>שמור</button>
          <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

function WishListPage({onGoToVac}) {
  const {state, dispatch} = useContext(Ctx);
  const wishes = state.wishlist || [];
  const [filterPriority, setFilterPriority] = useState('all');
  const [filterComp, setFilterComp] = useState('all');
  const [modal, setModal] = useState(null); // null | 'add' | {item}
  const [scheduleWish, setScheduleWish] = useState(null); // wish being converted to vacation

  const filtered = wishes.filter(w=>{
    if(filterPriority!=='all' && w.priority!==filterPriority) return false;
    if(filterComp!=='all' && w.composition!==filterComp) return false;
    return true;
  });

  function handleSave(f) {
    if(modal==='add') dispatch({t:'ADD_WISH', w:f});
    else dispatch({t:'UPD_WISH', id:modal.id, u:f});
    setModal(null);
  }

  function handleSchedule(w) {
    // Convert wish to vacation: open AddVacModal logic via state flag
    setScheduleWish(w);
  }

  const priorityOrder = {hot:0,dream:1,maybe:2};
  const sorted = [...filtered].sort((a,b)=>(priorityOrder[a.priority]||1)-(priorityOrder[b.priority]||1));

  return (
    <div style={{padding:'20px',maxWidth:1000,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <h1 style={{margin:0,fontSize:22,display:'flex',alignItems:'center',gap:8}}>🌟 חופשות חלום</h1>
        <button className="btn btn-primary" onClick={()=>setModal('add')}>+ הוסף חלום</button>
      </div>

      <div className="wishlist-filters">
        <button className={`ftab${filterPriority==='all'?' active':''}`} onClick={()=>setFilterPriority('all')}>הכל ({wishes.length})</button>
        {WISH_PRIORITY.map(p=>(
          <button key={p.key} className={`ftab${filterPriority===p.key?' active':''}`}
            style={filterPriority===p.key?{background:p.color,borderColor:p.color,color:'#fff'}:{}}
            onClick={()=>setFilterPriority(filterPriority===p.key?'all':p.key)}>
            {p.label} ({wishes.filter(w=>w.priority===p.key).length})
          </button>
        ))}
        <span style={{margin:'0 4px',color:'var(--text2)',alignSelf:'center'}}>|</span>
        {['זוגי','משפחתי','רז','אלינור'].map(c=>(
          <button key={c} className={`ftab${filterComp===c?' active':''}`}
            onClick={()=>setFilterComp(filterComp===c?'all':c)}>{c}</button>
        ))}
      </div>

      {sorted.length===0 && (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text2)'}}>
          <div style={{fontSize:48,marginBottom:12}}>🌟</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>אין חופשות חלום עדיין</div>
          <div style={{fontSize:13}}>לחץ "+ הוסף חלום" כדי להוסיף את החופשה הראשונה שאתה מחלום עליה</div>
        </div>
      )}

      <div className="wishlist-grid">
        {sorted.map(w=>{
          const pr = WISH_PRIORITY_MAP[w.priority] || WISH_PRIORITY_MAP.dream;
          const cn = COUNTRIES.find(c=>c.code===w.countryCode);
          return (
            <div key={w.id} className="wcard" style={{borderRightColor:pr.color}}>
              <div className="wcard-hdr">
                <div>
                  <div className="wcard-title">{w.name}</div>
                  {(cn||w.countryName) && (
                    <div className="wcard-country">
                      {cn && <span style={{marginLeft:4}}>{countryFlag(w.countryCode)}</span>}
                      {cn?.name||w.countryName}
                    </div>
                  )}
                </div>
                <div className="wcard-priority" title={pr.label}>{pr.label.split(' ')[0]}</div>
              </div>
              <div className="wcard-meta">
                {w.estimatedDays && <span>📅 {w.estimatedDays} ימים</span>}
                {w.composition && <span>👥 {w.composition}</span>}
                {w.addedDate && <span style={{marginRight:'auto'}}>נוסף {fmtDate(w.addedDate)}</span>}
              </div>
              {w.notes && <div className="wcard-notes">{w.notes}</div>}
              <div className="wcard-actions">
                <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={()=>handleSchedule(w)}>📅 קבע תאריך</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>setModal(w)}>✏️</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{ if(confirm('למחוק את "'+w.name+'" מרשימת החלומות?')) dispatch({t:'DEL_WISH',id:w.id}); }}>🗑️</button>
              </div>
            </div>
          );
        })}
      </div>

      {modal && (
        <WishModal
          item={modal==='add'?null:modal}
          onClose={()=>setModal(null)}
          onSave={handleSave}
        />
      )}

      {scheduleWish && (
        <ScheduleWishModal
          wish={scheduleWish}
          onClose={()=>setScheduleWish(null)}
          onScheduled={(vacId)=>{
            if(confirm('הוסף לרשימת החופשות! האם למחוק מרשימת החלומות?'))
              dispatch({t:'DEL_WISH',id:scheduleWish.id});
            setScheduleWish(null);
            onGoToVac && onGoToVac(vacId);
          }}
        />
      )}
    </div>
  );
}

function ScheduleWishModal({wish, onClose, onScheduled}) {
  const {dispatch} = useContext(Ctx);
  const cn = COUNTRIES.find(c=>c.code===wish.countryCode);
  const [f,setF] = useState({
    name: wish.name,
    type: 'planned',
    countryCode: wish.countryCode||'',
    countryName: cn?.name||wish.countryName||'',
    composition: wish.composition||'',
    startDate: '',
    endDate: '',
  });
  function save(){
    if(!f.startDate||!f.endDate) return;
    const id = genId();
    dispatch({t:'ADD_VAC', v:{...f, id, expenses:[], travelers:[]}});
    onScheduled(id);
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>📅 קבע תאריך לחופשה</h2>
        <div style={{background:'var(--bg)',borderRadius:8,padding:'8px 12px',marginBottom:12,fontSize:13,color:'var(--text2)'}}>
          מעביר את "<strong style={{color:'var(--text)'}}>{wish.name}</strong>" מרשימת החלומות לחופשה מתוכננת
        </div>
        <div className="fg"><label>שם</label>
          <input className="input" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
        </div>
        <div className="fg"><label>סוג</label>
          <div className="type-btns">
            {Object.entries(TYPE_LABELS).map(([k,v])=>(
              <button key={k} className={`type-btn${f.type===k?' active':''}`} style={{'--tc':COLORS[k]}} onClick={()=>setF({...f,type:k})}>{v}</button>
            ))}
          </div>
        </div>
        <div className="fg"><label>מדינה</label>
          <select className="input" value={f.countryCode} onChange={e=>{const c=COUNTRIES.find(x=>x.code===e.target.value);setF({...f,countryCode:e.target.value,countryName:c?.name||''});}}>
            <option value="">בחר מדינה...</option>
            {[...COUNTRIES].sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=><option key={c.code} value={c.code}>{c.name}</option>)}
          </select>
        </div>
        <div className="form-row">
          <div className="fg"><label>תאריך התחלה</label><input className="input" type="date" value={f.startDate} onChange={e=>setF({...f,startDate:e.target.value})}/></div>
          <div className="fg"><label>תאריך סיום</label><input className="input" type="date" value={f.endDate} onChange={e=>setF({...f,endDate:e.target.value})}/></div>
        </div>
        <div className="fg"><label>הרכב</label>
          <select className="input" value={f.composition} onChange={e=>setF({...f,composition:e.target.value})}>
            <option value="">בחר הרכב...</option>
            {['רז','אלינור','זוגי','משפחתי'].map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div className="modal-actions">
          <button className="btn btn-primary" onClick={save} disabled={!f.startDate||!f.endDate}>שמור חופשה</button>
          <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [route,setRoute]=useState('/calendar');
  const [user,setUser]=useState(undefined);
  const [navOpen,setNavOpen]=useState(window.innerWidth>640);
  const [focusVacId,setFocusVacId]=useState(null);
  const [plannerVacId,setPlannerVacId]=useState(null);
  const Page={'/calendar':CalendarPage,'/planner':DailyPlannerPage,'/map':WorldMapPage,'/vacations':VacationsPage,'/wishlist':WishListPage,'/dashboard':DashboardPage,'/travelers':TravelersPage,'/settings':SettingsPage}[route]||CalendarPage;
  function goToVac(id){setFocusVacId(id);setRoute('/vacations');}
  function clearFocus(){setFocusVacId(null);}
  function goToPlanner(id){setPlannerVacId(id);setRoute('/planner');}

  useEffect(()=>{
    return auth.onAuthStateChanged(u=>setUser(u||null));
  },[]);

  if(user===undefined) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,color:'#64748B'}}>
      <div style={{fontSize:40}}>🌴</div><div>טוען...</div>
    </div>
  );

  if(user===null) return <AuthScreen/>;

  const isMobile = window.innerWidth <= 640;
  return (
    <StoreProvider>
      <Nav route={route} setRoute={setRoute} user={user} open={navOpen} setOpen={setNavOpen}/>
      <main className={`main${(!isMobile&&!navOpen)?' nav-collapsed':''}`}
            style={!isMobile&&navOpen?{}:{marginRight:0}}>
        <ExpiryWarningBanner/>
        <Page onGoToVac={goToVac} focusVacId={focusVacId} onClearFocus={clearFocus} onGoToPlanner={goToPlanner} plannerVacId={plannerVacId}/>
      </main>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
